server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Match multer's 10MB upload limit (nginx default 1m would 413 uploads).
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # API proxy — no trailing slash on proxy_pass so the full /api/... URI is
    # preserved. The browser's Origin header passes through untouched, so the
    # server's CORS allow-list (CLIENT_URL) must include this site's origin.
    location /api/ {
        proxy_pass http://api:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # CRA emits content-hashed files under /static/ — safe to cache forever.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback so deep-route refresh works; never cache index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
